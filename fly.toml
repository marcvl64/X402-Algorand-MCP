# fly.toml app configuration file generated for x402-algorand-mcp on 2026-07-27T21:57:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'x402-algorand-mcp'
primary_region = 'sjc'

[build]

[env]
  ALGOD_URL = 'https://mainnet-api.algonode.cloud'
  MCP_TRANSPORT = 'http'
  PORT = '3000'
  X402_DEFAULT_NETWORK = 'algorand:wGHE2Pwdvd7S12BL5FaOP20EGYesN73ktiC1qzkkit8='
  X402_FACILITATOR_URL = 'https://facilitator.goplausible.xyz'
  X402_MAX_AMOUNT_ATOMIC = '1000000'
  X402_PENDING_TTL_MS = '300000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
